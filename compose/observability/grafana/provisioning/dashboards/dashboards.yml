# Grafana dashboard provider for the observability overlay.
#
# Loads every dashboard JSON found under /var/lib/grafana/dashboards (the compose
# service mounts ./compose/observability/grafana/dashboards there). The starter
# gdi-node-standalone dashboard lives in that directory.

apiVersion: 1

providers:
  - name: gdi-node-standalone
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

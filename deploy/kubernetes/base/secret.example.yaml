# Placeholders only: never commit a real credential. Copy, fill, and apply out of band
# (or better: have your secrets operator generate it).
#
# This carries the AppRole secret-id, which is the one credential that must reach the pod
# out of band. role_id is not secret and lives in the ConfigMap's node.toml.
#
# Credential-free alternative (preferred where you can run an agent): drop this Secret
# entirely, run a Vault Agent / Secrets Operator sidecar that authenticates by whatever
# method your server supports (Kubernetes, JWT/OIDC, AWS IAM, TLS cert), and have it write
# the current token to a shared in-memory volume:
#
#   volumes:
#     - name: vault-token
#       emptyDir: { medium: Memory }
#
# then set [vault].token_file to that path. The node re-reads the file when its mtime
# changes, so no static credential is stored anywhere. Because the agent owns renewal,
# alert on gdi_vault_token_file_age_seconds (VaultTokenFileStale) — VaultRenewalFailing
# and VaultTokenLeaseTooShort cannot fire in that mode. See docs/operating.md §8.
apiVersion: v1
kind: Secret
metadata:
  name: gdi-node-standalone-vault
type: Opaque
stringData:
  secret-id: "<SET ME: the AppRole secret-id, from `vault write -f auth/approle/role/<role>/secret-id`>"

# The local-inbox shape, ready to apply:
#
#   kubectl apply -k deploy/kubernetes/overlays/inbox
#
# Thin on purpose: everything it does lives in ../../components/inbox, which states when
# this shape is the right one (S3 is the supported channel on Kubernetes; this is for a
# node that has no object store) and what you take on with it. Read that first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/inbox

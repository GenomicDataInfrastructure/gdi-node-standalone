# The OTLP intake credential for the push-telemetry overlay — placeholders. Like the
# base's secret.example.yaml this is not listed in any kustomization: copy
# it, fill it, and apply out of band (or have your secrets operator generate it).
#
# `headers` is the whole `OTEL_EXPORTER_OTLP_HEADERS` value: comma-separated
# `name=value` pairs, values URL-encoded — for Elastic APM,
# `Authorization=ApiKey%20<the key>`; for a bearer-token intake, `Authorization=Bearer%20<token>`.
apiVersion: v1
kind: Secret
metadata:
  name: gdi-node-standalone-otlp
type: Opaque
stringData:
  headers: "Authorization=ApiKey%20<SET ME: the intake API key>"

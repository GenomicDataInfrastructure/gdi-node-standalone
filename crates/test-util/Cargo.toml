[package]
name = "test-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Dev-only internal helper crate — never published.
publish = false

# This crate inherits the workspace lints like every other member. It is the audited home
# for the `unsafe` that Rust 2024 requires for `std::env::set_var` / `remove_var`: the
# workspace sets `unsafe_code = "deny"` rather than `forbid`, so the two mutators carry
# `#[expect(unsafe_code, reason = ...)]` at the block and every other lint — `pedantic`,
# `unwrap_used`, `todo`, `dbg_macro`, `unreachable_pub` — applies here as normal.
[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }

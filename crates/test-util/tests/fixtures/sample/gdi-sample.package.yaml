metadata:
  prefix: "GDI"
  org: "UTARTU"
  catalog: "gdi-aggregated"
  title: "Synthetic three-country aggregated allele frequencies (realistic sample)"
  description: "A synthetic, sites-only allele-frequency export in the shape a bcftools +fill-tags chain produces: real GRCh38 chr21 sites with simulated counts for a 4986-individual cohort stratified by country (EE, FI, LV) and sex, plus chrX, chrY and chrM. No individual's data; generated by scripts/gen-sample-vcf.py."
  accessRights: "http://publications.europa.eu/resource/authority/access-right/PUBLIC"
  applicableLegislation:
    - "http://data.europa.eu/eli/reg/2025/327/oj"
  license: "https://creativecommons.org/licenses/by/4.0/"
  creator:
    - name: "Genome of Europe - EE node"
  healthCategory:
    - "http://data.gdi.eu/core/p2/HealthCategoryHumanGenomic"
  keywords:
    - allele-frequency
    - genomics
    - synthetic
  numberOfUniqueIndividuals: 4986

files:
  - category: "VCF"
    reference: "GRCh38"
    files:
      - "gdi-sample.GRCh38.vcf.gz"

config:
  mode: aggregated
  blockRange: 10000000
  afSource: "The Genome of Europe"
  afSourceReference: "https://genomeofeurope.eu/"
  # 0 = NO build-time k-anonymity floor, so every simulated row reaches parquet and the
  # generator's ground truth (gdi-sample.expected.json) is what the converter reports. A
  # REAL dataset should set a floor (~10 = k=5 distinct individuals, since this counts
  # ALLELES); the node's serve-time [beacon].min_allele_count composes with it as
  # max(build, serve).
  minAlleleCount: 0

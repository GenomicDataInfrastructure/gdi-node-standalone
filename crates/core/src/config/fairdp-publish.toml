# The node's built-in [fairdp.publish]: what HealthDCAT-AP release 8 asks for beyond the
# records the node builds itself, in a form releases 5 and 7 accept too. Every node with a
# [fairdp] block publishes it. The node's own [fairdp.publish] goes over it key by key: a
# key set there replaces the value here, and `rename_properties = { "<property>" = [] }`
# drops a property added here.

# Every value of these properties is also given this rdf:type.
[fairdp.publish.type_values]
"dcatap:applicableLegislation" = "eli:LegalResource"
"dct:accessRights" = "dct:RightsStatement"
"dct:license" = "dct:LicenseDocument"
"dct:language" = "dct:LinguisticSystem"
"dpv:hasLegalBasis" = "dpv:LegalBasis"

# A column title is written once, as csvw:title, and published as csvw:titles too: release
# 8 reads the first name, releases 5 and 7 the second.
[fairdp.publish.rename_properties]
"csvw:title" = ["csvw:title", "csvw:titles"]

# Whether the dataset holds structured data and, if so, its variables (a CSVW table
# group). Every aggregated dataset has the same allele-frequency table.
[fairdp.publish.add.dataset.aggregated]
"healthdcatap:hasStructuredData" = true
"healthdcatap:hasVariables".a = "csvw:TableGroup"
"healthdcatap:hasVariables"."dct:title" = "Allele frequency data"
"healthdcatap:hasVariables"."csvw:table".a = "csvw:Table"
"healthdcatap:hasVariables"."csvw:table"."dct:title" = "Allele frequencies"
"healthdcatap:hasVariables"."csvw:table"."dct:description" = "One row per variant and population. The data is split into one file per chromosome, block of positions and source VCF."
"healthdcatap:hasVariables"."csvw:table"."csvw:column" = [
  { a = "csvw:Column", "csvw:name" = "CHROM", "csvw:title" = "Chromosome", "dct:description" = "Chromosome of the variant, given by the file the row is in.", "csvw:datatype" = "string" },
  { a = "csvw:Column", "csvw:name" = "POS", "csvw:title" = "Position", "dct:description" = "Position of the variant on the chromosome, 0-based (the VCF position minus one), in the dataset's reference assembly.", "csvw:datatype" = "integer" },
  { a = "csvw:Column", "csvw:name" = "REF", "csvw:title" = "Reference allele", "dct:description" = "Reference allele.", "csvw:datatype" = "string" },
  { a = "csvw:Column", "csvw:name" = "ALT", "csvw:title" = "Alternate allele", "dct:description" = "Alternate allele.", "csvw:datatype" = "string" },
  { a = "csvw:Column", "csvw:name" = "VT", "csvw:title" = "Variant type", "dct:description" = "Type of the variant: SNP, MNP, INS, DEL or DELINS.", "csvw:datatype" = "string" },
  { a = "csvw:Column", "csvw:name" = "POPULATION", "csvw:title" = "Population", "dct:description" = "The group of people the counts are over. A two-letter country code, optionally with _M or _F for sex, M or F alone, or Total.", "csvw:datatype" = "string" },
  { a = "csvw:Column", "csvw:name" = "AF", "csvw:title" = "Allele frequency", "dct:description" = "Frequency of the alternate allele in the population.", "csvw:datatype" = "float" },
  { a = "csvw:Column", "csvw:name" = "AC", "csvw:title" = "Allele count", "dct:description" = "Number of alternate alleles in the population, if given.", "csvw:datatype" = "integer" },
  { a = "csvw:Column", "csvw:name" = "AN", "csvw:title" = "Allele number", "dct:description" = "Number of alleles called in the population, if given.", "csvw:datatype" = "integer" },
  { a = "csvw:Column", "csvw:name" = "AC_HOM", "csvw:title" = "Homozygous count", "dct:description" = "Number of alternate alleles carried by homozygous individuals (two each), if given.", "csvw:datatype" = "integer" },
  { a = "csvw:Column", "csvw:name" = "AC_HET", "csvw:title" = "Heterozygous count", "dct:description" = "Number of alternate alleles carried by heterozygous individuals (one each), if given.", "csvw:datatype" = "integer" },
  { a = "csvw:Column", "csvw:name" = "AC_HEMI", "csvw:title" = "Hemizygous count", "dct:description" = "Number of alternate alleles carried by hemizygous individuals (one each), if given.", "csvw:datatype" = "integer" },
]

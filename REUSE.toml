# REUSE (https://reuse.software) licensing metadata, specification 3.3.
#
# Directory annotations rather than per-file headers. The alternative — an SPDX header in
# each of ~600 files — states one fact 600 times, and every new file is a chance to omit or
# mistype it. Here the fact is stated once per directory and a new file inherits it, which
# is what `reuse lint` then verifies in CI.
#
# Ordering matters: when several `[[annotations]]` match the same path, the *last* match
# wins. The catch-all comes first and the vendored third-party sets override it below.
#
# `precedence = "closest"` (the default) means a file's own SPDX header outranks anything
# here. That is deliberate for `conformance/shapes/gdi-metadata/`, whose `.ttl` files carry
# upstream Health-RI headers: this file must not silently relabel them.

version = 1
SPDX-PackageName = "gdi-node-standalone"
SPDX-PackageDownloadLocation = "https://github.com/GenomicDataInfrastructure/gdi-node-standalone"

# --- First-party: everything not overridden below ----------------------------------------
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "The gdi-node-standalone Authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- The generated attribution bundle -----------------------------------------------------
# `THIRD-PARTY-LICENSES.md` quotes the full licence text of every dependency, so it contains
# other projects' `SPDX-License-Identifier` strings as *content*. Without `override`, REUSE
# reads the first of those as the file's own declaration and then reports the identifier as
# a missing licence — a false positive produced by the file doing exactly its job.
#
# The declaration below is about the compilation, not about the quoted texts: each of those
# carries its own terms inline, and the file is generated by `cargo about` from `about.hbs`.
[[annotations]]
path = "THIRD-PARTY-LICENSES.md"
precedence = "override"
SPDX-FileCopyrightText = "The gdi-node-standalone Authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# --- Vendored: GA4GH Beacon v2 framework + default model ---------------------------------
# Upstream ga4gh-beacon/beacon-v2, released into the public domain under CC0 1.0. Pinned
# commit, upstream URL and per-file SHA256SUMS are recorded in each directory's VENDORED.md.
[[annotations]]
path = [
    "conformance/ga4gh-beacon-v2/**",
    "conformance/ga4gh-beacon-v2-default-model/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "Global Alliance for Genomics and Health"
SPDX-License-Identifier = "CC0-1.0"

# --- Vendored: GA4GH Variation Representation Specification 1.3 ---------------------------
# Upstream ga4gh/vrs at tag 1.3, Apache-2.0. Upstream ships no NOTICE file.
[[annotations]]
path = "conformance/ga4gh-vrs-1.3/**"
precedence = "closest"
SPDX-FileCopyrightText = "Global Alliance for Genomics and Health"
SPDX-License-Identifier = "Apache-2.0"

# --- Vendored: GDI metadata SHACL shapes --------------------------------------------------
# Upstream GenomicDataInfrastructure/gdi-metadata, Apache-2.0, copyright Health-RI. The
# `.ttl` files carry their own upstream SPDX headers, which `precedence = "closest"` leaves
# in force; this entry covers the directory's other upstream-derived files. Its own
# `VENDORED.md` is reclaimed by the block below, because that file is written here.
[[annotations]]
path = "conformance/shapes/gdi-metadata/**"
precedence = "closest"
SPDX-FileCopyrightText = "Health-RI"
SPDX-License-Identifier = "Apache-2.0"

# --- Our own notes *about* the vendored material ---------------------------------------
# Each vendored directory carries a `VENDORED.md` written here, not upstream: it describes
# `scripts/vendored.sh`, the gate legs that verify the pins, and how this repository uses
# the files. It is this project's documentation that happens to sit in a vendored
# directory, so the entries above would otherwise attribute our prose to GA4GH or Health-RI
# — and for the two CC0 sets, dedicate our own writing to the public domain in someone
# else's name. Last match wins, so this block reclaims them.
#
# `SHA256SUMS` stays with the upstream block above: it is a digest *of* upstream bytes and
# carries no authorship of its own.
[[annotations]]
path = [
    "conformance/ga4gh-beacon-v2/VENDORED.md",
    "conformance/ga4gh-beacon-v2-default-model/VENDORED.md",
    "conformance/ga4gh-vrs-1.3/VENDORED.md",
    "conformance/shapes/gdi-metadata/VENDORED.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "The gdi-node-standalone Authors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
